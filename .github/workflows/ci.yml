name: CI

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          go tool golangci-lint fmt
          git diff --exit-code

      - name: Lint
        run: go tool golangci-lint run ./...

      - name: Test with race detection
        run: go test -race ./...

      - name: Build static Linux binaries
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" \
              -o "dist/wgproxy-linux-$arch" .
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify the unprivileged container
        run: |
          docker buildx build \
            --file Dockerfile \
            --target prebuilt \
            --platform linux/amd64 \
            --load \
            --tag wgproxy:ci \
            dist
          docker run --rm \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            --entrypoint=/wgproxy \
            wgproxy:ci unexpected-argument 2>startup-error.log && exit 1
          grep -q 'usage:' startup-error.log

      - name: Generate image metadata
        if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}

      - name: Log in to GHCR
        if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform image to GHCR
        if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        uses: docker/build-push-action@v6
        with:
          context: ./dist
          file: ./Dockerfile
          target: prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
