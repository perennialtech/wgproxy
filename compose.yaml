services:
  wgproxy:
    build: .
    image: wgproxy:local
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - ./wireguard:/etc/wgproxy/wireguard:ro

    environment:
      WG_CONFIG_DIR: /etc/wgproxy/wireguard
      PROXY_ADDR: 0.0.0.0:8080
      ADMIN_ADDR: 127.0.0.1:9090
      MAX_ACTIVE: "256"

    read_only: true

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    stop_grace_period: 20s

    healthcheck:
      test: ["CMD", "/wgproxy", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
